# alembic.ini
# ─────────────────────────────────────────────────────────────────────────────
# Alembic configuration file.
# Run alembic commands from the PROJECT ROOT (same folder as this file):
#
#   alembic revision --autogenerate -m "description"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic history
# ─────────────────────────────────────────────────────────────────────────────

[alembic]
# Path to the migrations folder (relative to this file)
script_location = database/migrations

# Template used to generate new revision files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for generated revision timestamps
timezone = UTC

# Max length of the slug (portion of revision filename after the rev id)
truncate_slug_length = 40

# The SQLAlchemy URL is set dynamically in env.py from settings.database_url
# (Do NOT set sqlalchemy.url here — it's overridden in env.py)
sqlalchemy.url =

# ── Logging config ────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
